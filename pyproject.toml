[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulaml"
version = "0.1.0"
description = "A Machine Learning Model Management Platform"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "fastapi>=0.104.1",
    "pydantic>=2.5.2",
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "prometheus-client>=0.19.0",
    "docker>=6.1.3",
    "python-multipart>=0.0.6",
    "aiohttp>=3.9.1",
    "hvac>=1.2.0",
    "httpx>=0.25.2",
    "uvicorn>=0.24.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "rich>=13.7.0"
]
requires-python = ">=3.8"

[project.optional-dependencies]
test = [
    "pytest>=7.4.1",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=nebulaml --cov-report=term-missing" 